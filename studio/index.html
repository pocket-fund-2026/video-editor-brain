<title>Reel Edit Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: editing styles sidebar | stage + timeline | live animation picker */
:root{--bg:#EEF3F4;--panel:#FFFFFF;--panel2:#E3ECEE;--line:#CBDADF;--fg:#0A2A36;--mute:#4F6F7B;--accent:#0D485D;--accent2:#2F6F84;--onacc:#FFFFFF;--pale:#9EC3CF;--hot:#C4572F;--ok:#2E7D5B;
--stage:#08303E;--disp:'Montserrat',system-ui,sans-serif;--body:'Source Sans 3',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#071820;--panel:#0C2530;--panel2:#11323F;--line:#1B4251;--fg:#E8F1F3;--mute:#8FB1BD;--accent:#2F9DBB;--accent2:#6FC0D6;--onacc:#04232D;--pale:#9EC3CF;--hot:#E8845C;--ok:#5CC49A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#071820;--panel:#0C2530;--panel2:#11323F;--line:#1B4251;--fg:#E8F1F3;--mute:#8FB1BD;--accent:#2F9DBB;--accent2:#6FC0D6;--onacc:#04232D;--pale:#9EC3CF;--hot:#E8845C;--ok:#5CC49A;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--disp);margin:0;text-wrap:balance}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.top{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:16px 0 12px}
.brand{display:flex;gap:12px;align-items:center}
.mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--onacc);display:grid;place-items:center;font:800 17px var(--disp)}
.brand h1{font-size:19px;letter-spacing:-.01em}
.brand p{margin:0;color:var(--mute);font-size:13px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 13px;font:600 13px var(--disp);display:inline-flex;gap:7px;align-items:center}
.btn:hover{border-color:var(--accent2)}
.btn.pri{background:var(--accent);color:var(--onacc);border-color:var(--accent)}
.btn.sm{padding:5px 9px;font-size:12px}
.shell{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px;padding-bottom:40px}
@media(max-width:860px){.shell{grid-template-columns:1fr}}
.rail{display:flex;flex-direction:column;gap:10px}
@media(max-width:860px){.rail{flex-direction:row;overflow-x:auto;padding-bottom:4px}.rail .vcard{min-width:200px}}
.vcard{border:1px solid var(--line);background:var(--panel);border-radius:12px;overflow:hidden;text-align:left;padding:0;display:block;width:100%}
.vcard[aria-current=true]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.vcard img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--stage)}
.vcard .m{padding:9px 11px 11px}
.vcard b{font:700 13px/1.25 var(--disp);display:block}
.vcard span{font:400 12px var(--mono);color:var(--mute)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:9px 14px;font:700 13px var(--disp);color:var(--mute);white-space:nowrap}
.tab[aria-selected=true]{color:var(--fg);border-bottom-color:var(--accent)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.k{font:600 11px var(--disp);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:12px}
.stat{background:var(--panel2);border-radius:10px;padding:10px 12px}
.stat b{font:700 22px var(--disp);display:block;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--mute)}
.tree{font:400 13px/1.7 var(--mono);white-space:pre;overflow-x:auto;margin:8px 0 0}
.tree i{font-style:normal;color:var(--mute)}
.pill{display:inline-block;font:600 11px var(--disp);padding:3px 9px;border-radius:99px;background:var(--panel2);color:var(--fg)}
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.pill.pl{background:color-mix(in srgb,var(--accent2) 20%,transparent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label.f{display:grid;gap:4px;font:600 12px var(--disp);color:var(--mute)}
label.f input,label.f select,label.f textarea{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 9px;font:400 14px var(--body);color:var(--fg);width:100%}
textarea{resize:vertical;min-height:56px}
/* transcript */
.seg{display:grid;grid-template-columns:auto 62px 1fr auto;gap:10px;align-items:start;padding:9px 6px;border-bottom:1px solid var(--line);border-radius:8px}
.seg.keep{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.seg .tc{font:400 12px var(--mono);color:var(--mute);padding-top:2px}
.seg .tx{font-size:14.5px}
.seg.cut .tx{color:var(--mute)}
.gap{grid-column:2/-1;font:400 11px var(--mono);color:var(--hot)}
.ord{font:700 12px var(--disp);background:var(--accent);color:var(--onacc);border-radius:99px;min-width:22px;height:22px;display:inline-grid;place-items:center;padding:0 6px}
.arrows button{border:1px solid var(--line);background:var(--panel);border-radius:6px;width:26px;height:24px;line-height:1}
/* edit */
.edwrap{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;align-items:start}
@media(max-width:1000px){.edwrap{grid-template-columns:1fr}}
.eds{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-bottom:12px}
.ed{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 12px;text-align:left}
.ed[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.ed b{font:700 13px var(--disp);display:block}
.ed span{font-size:12px;color:var(--mute)}
.stagebox{background:#04141A;border-radius:12px;padding:14px;display:grid;place-items:center}
.stage{position:relative;overflow:hidden;background:var(--stage);container-type:inline-size;border-radius:6px;color:#fff}
.stage.h{width:100%;aspect-ratio:16/9}
.stage.v{height:min(560px,70vh);aspect-ratio:9/16;max-width:100%}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s}
.layer{position:absolute;inset:0;pointer-events:none}
.zone{position:absolute;container-type:inline-size}
.stage.h .zone{left:55%;top:9%;width:41%;height:58%}
.stage.v .zone{left:6%;top:6%;width:88%;height:40%}
.card{position:absolute;inset:0;background:var(--k0,#E8F1F3);color:var(--k1,#0D485D);border-radius:4cqw;padding:6cqw;display:flex;flex-direction:column;justify-content:center;gap:2cqw;box-shadow:0 2cqw 6cqw #0006}
.card.dk{background:var(--k1,#0D485D);color:#fff}
.card h4{margin:0;font:700 6cqw var(--disp);letter-spacing:.02em}
.card small{font:600 4.2cqw var(--disp);color:var(--k2,#2F6F84);letter-spacing:.06em;text-transform:uppercase}
.card.dk small{color:var(--k3,#9EC3CF)}
.big{font:800 22cqw/1 var(--disp);font-variant-numeric:tabular-nums}
.dots{display:grid;grid-template-columns:repeat(10,1fr);gap:1.6cqw}
.dots i{aspect-ratio:1;border-radius:50%;background:var(--k1,#0D485D)26}
.dots i.on{background:var(--k1,#0D485D)}
.giant{position:absolute;left:0;right:0;top:12%;text-align:center;font:800 min(34cqw,60cqh)/1 var(--disp);color:#fff;opacity:.0;text-shadow:0 0 0 #fff;-webkit-text-stroke:0}
.stage.v .giant{top:10%;font-size:44cqw}
.gl{position:absolute;left:0;right:0;text-align:center;font:700 3.2cqw var(--disp);letter-spacing:.2em;color:var(--k3,#9EC3CF)}
.lower{position:absolute;left:4%;bottom:19%;background:var(--k1,#0D485D);color:#fff;padding:1.4cqw 3cqw 1.4cqw 2.4cqw;border-left:1cqw solid var(--k3,#9EC3CF);font:700 3.2cqw var(--disp);box-shadow:0 1cqw 3cqw #0006}
.lower small{display:block;font:500 2.1cqw var(--body);color:var(--k3,#9EC3CF);letter-spacing:.05em}
.titlecard{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:radial-gradient(circle at 50% 40%,var(--k1,#0D485D),var(--k4,#08303E));gap:1.5cqw}
.titlecard b{font:800 6.5cqw/1.1 var(--disp)}
.titlecard em{font:600 3cqw var(--disp);font-style:normal;color:var(--k3,#9EC3CF)}
.titlecard u{text-decoration:none;font:600 1.8cqw var(--disp);letter-spacing:.4em;color:var(--k3,#9EC3CF);margin-top:3cqw}
.stamp{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) rotate(-6deg);border:.8cqw solid #fff;color:#fff;padding:1cqw 3cqw;font:800 7cqw var(--disp);letter-spacing:.05em;white-space:nowrap;background:var(--k1,#0D485D)cc}
.cap{position:absolute;left:5%;right:5%;bottom:9%;text-align:center;font:700 3.6cqw/1.25 var(--disp);color:var(--k3,#9EC3CF)}
.stage.v .cap{font-size:6cqw;bottom:14%}
.cap b{color:#fff;font-weight:800}
.cap.clean{background:var(--k4,#08303E)cc;color:var(--k0,#E8F1F3);padding:1.2cqw 2cqw;border-radius:1cqw;left:12%;right:12%;font-weight:600}
.cap.pop{font-size:9cqw;color:#fff;text-shadow:0 .5cqw 2cqw #000a}
.stage.v .cap.pop{font-size:14cqw}
.bars{display:flex;gap:2.5cqw;align-items:flex-end;height:48%}
.bars div{flex:1;background:var(--k1,#0D485D);border-radius:1cqw 1cqw 0 0;position:relative;min-height:2px}
.bars span{position:absolute;bottom:-5.4cqw;left:0;right:0;text-align:center;font:600 3.4cqw var(--disp);color:var(--k2,#2F6F84)}
.stairs{display:flex;align-items:flex-end;gap:1.5cqw;height:56%}
.stairs div{flex:1;background:var(--k3,#9EC3CF);border-radius:1cqw 1cqw 0 0;padding:1.5cqw;font:700 3.2cqw/1.15 var(--disp);color:var(--k4,#08303E);display:flex;align-items:flex-start}
.stairs div:last-child{background:#fff}
.cmp{display:grid;grid-template-columns:1fr auto 1fr;gap:3cqw;align-items:center}
.cmp>div{background:#fff;border-radius:2.5cqw;padding:4cqw 3cqw;text-align:center;color:var(--k1,#0D485D)}
.cmp>div:last-child{background:var(--k1,#0D485D);color:#fff}
.cmp b{display:block;font:800 7cqw/1.1 var(--disp)}
.cmp span{font:600 3.4cqw var(--disp);color:var(--k2,#2F6F84);letter-spacing:.05em;text-transform:uppercase}
.cmp>div:last-child span{color:var(--k3,#9EC3CF)}
.cmp u{text-decoration:none;font:700 3.4cqw var(--disp);color:var(--k2,#2F6F84)}
.chk{list-style:none;margin:0;padding:0;display:grid;gap:3cqw}
.chk li{display:flex;gap:3cqw;align-items:center;font:700 5cqw var(--disp)}
.chk li i{width:7cqw;height:7cqw;border-radius:1.6cqw;border:.7cqw solid var(--k1,#0D485D);display:grid;place-items:center;font-style:normal;font-size:5cqw;color:#fff;flex:none}
.chk li.on i{background:var(--k1,#0D485D)}
.cm{display:flex;gap:3cqw;align-items:flex-start}
.cm i{width:10cqw;height:10cqw;border-radius:50%;background:var(--k1,#0D485D);color:#fff;display:grid;place-items:center;font:800 5cqw var(--disp);font-style:normal;flex:none}
.cm p{margin:0;font:600 5cqw/1.3 var(--disp)}
.pillstat{position:absolute;left:0;right:0;top:20%;text-align:center}
.pillstat span{display:inline-block;background:var(--k1,#0D485D);color:#fff;font:700 7cqw var(--disp);padding:2.5cqw 6cqw;border-radius:99px;border:.7cqw solid var(--k3,#9EC3CF)}
.route svg{width:100%;height:auto;overflow:visible}
.route text{font:700 5.6px var(--disp);fill:var(--k1,#0D485D)}
.ph{position:absolute;left:10px;top:10px;font:600 10px var(--mono);background:#0008;color:#fff;padding:3px 7px;border-radius:5px}
.tport{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.tport .tc{font:500 13px var(--mono);color:var(--mute);margin-left:auto}
.tl{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;user-select:none}
.tlrow{position:relative;height:34px;display:flex;gap:2px;cursor:pointer}
.tlseg{background:var(--accent);color:var(--onacc);border-radius:5px;font:600 11px var(--mono);display:grid;place-items:center;min-width:0;overflow:hidden;opacity:.85}
.tlanim{position:relative;height:96px;margin-top:6px;cursor:pointer;background:repeating-linear-gradient(0deg,transparent 0 23px,var(--line) 23px 24px)}
.mk{position:absolute;height:20px;border-radius:5px;background:var(--pale);color:#08303E;font:700 10px/20px var(--disp);padding:0 6px;overflow:hidden;white-space:nowrap;border:1px solid transparent}
.mk.back{background:var(--accent2);color:#fff}
.mk.off{opacity:.35}
.mk.sel{border-color:var(--hot);box-shadow:0 0 0 2px var(--hot)}
.ph-line{position:absolute;top:0;bottom:0;width:2px;background:var(--hot);pointer-events:none;z-index:3}
.ins{display:grid;gap:12px;min-width:0}.ins .sec{min-width:0;grid-template-columns:minmax(0,1fr)}.alist,.ai{min-width:0}.ai .b{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.ins .grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important}label.f{min-width:0}.hook{position:absolute;left:6%;right:6%;top:62%;text-align:center;font:800 5.4cqw/1.15 var(--disp);text-shadow:0 .6cqw 3cqw #000c;color:#fff;opacity:0}.stage.v .hook{font-size:9cqw;top:56%}
.ins .sec{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:9px}
.alist{display:grid;gap:6px}
.ai{border:1px solid var(--line);border-radius:9px;background:var(--bg)}
.ai[aria-current=true]{border-color:var(--hot)}
.ai>.h{display:flex;gap:8px;align-items:center;padding:7px 9px;cursor:pointer}
.ai>.h b{font:700 12px var(--disp);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ai>.h span{font:400 11px var(--mono);color:var(--mute)}
.ai .b{padding:2px 10px 10px;display:grid;gap:8px;grid-template-columns:1fr 1fr}
.ai .b .w{grid-column:1/-1}
.sw{width:34px;height:20px;border-radius:99px;background:var(--line);position:relative;border:0;padding:0;flex:none}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.sw[aria-checked=true]{background:var(--accent)}
.sw[aria-checked=true]::after{left:16px}
.note{font-size:12.5px;color:var(--mute)}
.rend{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.rend video{width:100%;border-radius:8px;background:#000;display:block}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:9px;font:600 13px var(--disp);z-index:50}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* Reel Studio layout: styles sidebar | stage + animation picker | timeline + animation list */
body{padding:0;margin:0}
.app{display:grid;grid-template-columns:310px minmax(0,1fr);min-height:100vh}
@media(max-width:980px){.app{grid-template-columns:1fr}}
.side{background:var(--panel);border-right:1px solid var(--line);padding:16px 14px 40px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;align-self:start;max-height:100vh;overflow-y:auto}
@media(max-width:980px){.side{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line)}}
.brand{display:flex;gap:10px;align-items:center}
.brand h1{font-size:17px;letter-spacing:-.01em}
.brand p{margin:0;color:var(--mute);font-size:12px}
.clips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.clip{border:1px solid var(--line);border-radius:8px;overflow:hidden;padding:0;background:var(--panel2);position:relative}
.clip img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.clip span{position:absolute;left:0;right:0;bottom:0;background:#000a;color:#fff;font:600 9px var(--mono);text-align:center;padding:1px 0}
.clip[aria-current=true]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.styles{display:grid;gap:8px}
.sty{border:1px solid var(--line);border-radius:11px;background:var(--bg);overflow:hidden}
.sty[aria-current=true]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.sty>button.hd{all:unset;box-sizing:border-box;display:flex;gap:10px;align-items:center;width:100%;padding:10px 12px;cursor:pointer}
.sty .asp{flex:none;border:2px solid var(--accent);border-radius:3px;background:var(--panel2)}
.sty .asp.v{width:14px;height:24px}.sty .asp.h{width:28px;height:16px}
.sty .hd b{font:700 13px var(--disp);display:block}
.sty .hd small{font-size:12px;color:var(--mute);display:block}
.sty .body{padding:2px 12px 12px;display:grid;gap:9px;border-top:1px solid var(--line);background:var(--panel)}
.sty .body .g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.togs{display:grid;gap:7px}
.togs label{display:flex;gap:9px;align-items:center;font-size:13px}
.k2{font:700 10.5px var(--disp);letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
.main{padding:16px 18px 50px;display:grid;gap:14px;min-width:0;align-content:start}
.mtop{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.mtop h2{font-size:18px}
.work{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:14px;align-items:start}
@media(max-width:1250px){.work{grid-template-columns:1fr}}
.pick{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px;max-height:calc(100vh - 90px);overflow-y:auto;position:sticky;top:12px}
@media(max-width:1250px){.pick{position:static;max-height:none}}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;display:block;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.tile:hover,.tile:focus-visible{border-color:var(--accent2);box-shadow:0 0 0 2px var(--accent2)}
.tile .stage{border-radius:0;aspect-ratio:16/9;width:100%;background:var(--stage) center/cover no-repeat}
.tile .stage .zone{left:50%;top:8%;width:46%;height:70%}
.tile .stage .giant{top:18%;font-size:28cqw}
.tile .stage .stamp{top:45%}
.tile .stage .lower{bottom:14%}
.tile .stage:before{content:"";position:absolute;inset:0;background:#08303E88}
.tile .cap2{display:flex;justify-content:space-between;align-items:center;padding:6px 9px;gap:6px}
.tile .cap2 b{font:700 11.5px var(--disp)}
.tile .cap2 i{font:600 9.5px var(--disp);font-style:normal;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.tile.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.atl{display:grid;gap:8px}
.alist2{display:grid;gap:6px}
.chip{font:600 11px var(--disp);padding:3px 9px;border-radius:99px;background:var(--panel2)}
.hint{font-size:12.5px;color:var(--mute);margin:0}
.stagebox{padding:12px}
.stage.h{max-height:62vh;margin:0 auto}
.btn.on{background:var(--accent);color:var(--onacc);border-color:var(--accent)}


.lib{display:grid;gap:6px}
.lb{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding:8px 10px;border:1px dashed var(--line);border-radius:10px;background:var(--bg)}
.lb:hover,.lb:focus-visible{border-color:var(--accent);background:var(--panel2)}
.lb .pl{font:800 15px var(--disp);color:var(--accent);width:22px;text-align:center}
.lb b{font:700 12.5px var(--disp);display:block}

 if(S.play.T>=total(v,e)-.05)S.play.T=0;seek(S.play.T);vid.play().catch(()=>{});
 cancelAnimationFrame(eng.raf);const loop=()=>{if(!S.play.on)return;const v=V(),e=ED(),it=items(v,e),o=it[eng.idx];if(!o){pause();return}
  const vid=$('#stage video');let ct=vid.currentTime;
  if(ct>=o.g.e-.02){if(eng.idx+1>=it.length){pause();S.play.T=0;seek(0);return}eng.idx++;const n=it[eng.idx];vid.currentTime=n.g.s;ct=n.g.s;S.play.T=n.off}
  else S.play.T=o.off+Math.max(0,ct-o.g.s);
  drawAt(S.play.T);eng.raf=requestAnimationFrame(loop)};eng.raf=requestAnimationFrame(loop)}
function pause(){S.play.on=false;const b=$('#pp');if(b)b.textContent='▶ Play edit';const vid=$('#stage video');if(vid)vid.pause();cancelAnimationFrame(eng.raf)}

 $$('.sty .hd').forEach(b=>b.onclick=()=>{if(b.dataset.e===cur.id)return;pause();S.ed[v.id]=b.dataset.e;S.sel[v.id]=0;S.play.T=0;render()});

 ch('f_name',x=>{e.name=x.value});ch('f_hook',x=>{e.hook=x.value;seek(S.play.T)});
 ch('f_asp',x=>{e.aspect=x.value;mountStage();renderStyles()});ch('f_grade',x=>{e.grade=x.value;mountStage()});ch('f_look',x=>{e.look=x.value;applyStyle()});ch('f_mot',x=>{e.motion=x.value;applyStyle()});ch('f_cap',x=>{e.cap=x.value;seek(S.play.T)});ch('f_mus',x=>{e.music=x.value});
 $('#f_sfx').onclick=()=>{e.sfx=!e.sfx;save(v,e);renderStyles()};$('#f_pun').onclick=()=>{e.punch=!e.punch;save(v,e);renderStyles();seek(S.play.T)};
 $('#dup').onclick=()=>{const id=String.fromCharCode(65+v.eds.length);const c=JSON.parse(JSON.stringify(e));c.id=id;c.name=e.name+' (copy)';c.status='planned';c.build=false;v.eds.push(c);S.ed[v.id]=id;S.sel[v.id]=0;save(v,c);render();toast('Copied as style '+id)};

function addAnim(t){
 const v=V(),e=ED(),it=items(v,e),T=S.play.T;pause();
 const cur=it.find(o=>T>=o.off&&T<o.end+.12)||it[0];
 e.anims.push({t,s:cur.i,o:Math.max(0,+(T-cur.off).toFixed(1)),d:ANIMS[t].full?2.8:3.5,l:'front',on:true,...SAMPLE[t]});

function animMarks(v,e){const it=items(v,e),T=total(v,e)||1;const lanes=[];
 return e.anims.map((a,k)=>{const o=it.find(x=>x.i===a.s);if(!o)return'';const st=o.off+a.o,en=st+a.d;let ln=lanes.findIndex(l=>l<=st);if(ln<0){ln=lanes.length;lanes.push(0)}lanes[ln]=en+.1;
  return`<div class="mk ${a.l==='behind'?'back':''} ${a.on?'':'off'} ${k===S.sel[v.id]?'sel':''}" data-k="${k}" style="left:${st/T*100}%;width:${Math.max(a.d/T*100,3)}%;top:${ln*24}px" title="${ANIMS[a.t].n}">${ANIMS[a.t].n.split(' ')[0]} ${esc(a.a).slice(0,14)}</div>`}).join('')}
function renderTimeline(){
 const v=V(),e=ED(),T=total(v,e);
 $('#cuts').innerHTML=items(v,e).map(o=>`<div class="tlseg" style="flex:${o.d}" title="${esc(o.g.t)}">${o.i}</div>`).join('');
 $('#anims').innerHTML=animMarks(v,e)+'<div class="ph-line" id="phl2"></div>';
 const from=(ev,el)=>{const r=el.getBoundingClientRect();pause();seek((ev.clientX-r.left)/r.width*T)};
 $('#cuts').onclick=ev=>from(ev,$('#cuts'));$('#anims').onclick=ev=>{if(ev.target.closest('.mk'))return;from(ev,$('#anims'))};
 $$('.mk').forEach(m=>m.onclick=()=>selectAnim(+m.dataset.k));
}
function selectAnim(k){const v=V();S.sel[v.id]=k;pause();renderTimeline();renderAList();const r=eng.runners[k];if(r&&r.start!=null)seek(r.start+r.a.d*.5);else seek(S.play.T)}
function aItem(a,i,k){const v=V(),e=ED(),M=ANIMS[a.t];const r=items(v,e).find(o=>o.i===a.s);
 const flds=Object.entries(M.f).map(([f,l])=>`<label class="f ${f==='a'||f==='items'?'w':''}">${l}<input data-f="${f}" value="${esc(a[f])}"></label>`).join('');
 return`<div class="ai" data-i="${i}" aria-current="${i===k}"><div class="h"><button class="sw" role="switch" aria-checked="${a.on}" aria-label="Enable"></button><b>${M.n}${a.a?': '+esc(a.a).slice(0,22):''}</b><span>${r?fmt(r.off+a.o).replace(/\.\d/,''):'cut'}</span></div>${i===k?`<div class="b"><label class="f w">Type<select data-f="t">${Object.entries(ANIMS).map(([t,m])=>`<option value="${t}" ${t===a.t?'selected':''}>${m.n}</option>`).join('')}</select></label>${flds}
 <label class="f">On cut<select data-f="s">${e.keep.map(s=>`<option value="${s}" ${s===a.s?'selected':''}>Cut ${s} · ${esc(v.segs[s].t.slice(0,18))}</option>`).join('')}</select></label><label class="f">Layer<select data-f="l"><option value="front" ${a.l==='front'?'selected':''}>In front of Dev</option><option value="behind" ${a.l==='behind'?'selected':''}>Behind Dev</option></select></label>
 <label class="f">Starts after (s)<input data-f="o" type="number" step="0.1" min="0" value="${a.o}"></label><label class="f">Lasts (s)<input data-f="d" type="number" step="0.1" min="0.8" max="9" value="${a.d}"></label>
 <button class="btn sm w" data-del="${i}">Remove animation</button></div>`:''}</div>`}
function renderAList(){
 const v=V(),e=ED(),k=S.sel[v.id]??0;
 $('#acount').textContent='Animations on this style ('+e.anims.length+')';
 $('#alist').innerHTML=e.anims.map((a,i)=>aItem(a,i,k)).join('')||'<p class="hint">None yet. Pick one from the right.</p>';
 $$('.ai>.h').forEach(h=>h.onclick=ev=>{if(ev.target.closest('.sw'))return;selectAnim(+h.parentNode.dataset.i)});
 $$('.ai .sw').forEach(s=>s.onclick=()=>{const a=e.anims[+s.closest('.ai').dataset.i];a.on=!a.on;save(v,e);afterAnim()});
 $$('.ai [data-f]').forEach(x=>x.onchange=x.oninput=()=>{const a=e.anims[+x.closest('.ai').dataset.i],f=x.dataset.f;a[f]=['o','d','s'].includes(f)?+x.value:x.value;const re=['l','t','s'].includes(f);save(v,e);if(re){afterAnim()}else{rebuildAnims();renderTimeline();seek(S.play.T)}});
 $$('.ai [data-del]').forEach(b=>b.onclick=()=>{e.anims.splice(+b.dataset.del,1);S.sel[v.id]=0;save(v,e);afterAnim()});
}

function presetKeep(v,mode){const E=v.eds,pick={hook:E[0],graphics:E[1]||E[0],punchy:E[2]||E[0]}[mode]||E[0];return pick.keep.slice()}
function makePreset(v,P,id){
 const base=v.eds[0],keep=presetKeep(v,P.cuts);
 const src=v.eds.filter(x=>!x.preset).flatMap(e=>e.anims),find=t=>src.find(a=>a.t===t);
 const anims=P.anims.map((t,i)=>{const ex=find(t),smp=ex?{a:ex.a,b:ex.b,items:ex.items}:{...SAMPLE[t]};
  if(t==='title'){smp.a=v.title;smp.b=v.sub||''}if(t==='lower'){smp.a='Dev Shah';smp.b='Founder, Kautilya'}
  const idx=Math.min(keep.length-1,Math.round(i*(keep.length-1)/Math.max(1,P.anims.length-1)));
  return{t,s:keep[idx],o:i===0?0.2:0.6,d:ANIMS[t].full?2.8:3.6,l:t==='giant'?'behind':'front',on:true,...smp}});
 return{id,preset:P.k,name:P.n,tag:P.aspect+' · '+P.src,aspect:P.aspect,keep,hook:base.hook,look:P.look,motion:P.motion,grade:P.grade,cap:P.cap,music:P.music,sfx:P.sfx,punch:P.punch,status:'planned',build:false,anims}}
function seedPresets(){D.forEach(v=>{const base=v.eds.length;PRESETS.forEach((P,i)=>{v.eds.push(makePreset(v,P,String.fromCharCode(65+base+i)))})})}
function renderLib(){return;$('#lib').innerHTML=PRESETS.map(p=>`<button class="lb" data-k="${p.k}"><span class="pl">+</span><span><b>${esc(p.n)}</b><small>${esc(p.d)}<br><i>From ${esc(p.src)}</i></small></span></button>`).join('');$$('.lb').forEach(b=>b.onclick=()=>addPreset(b.dataset.k))}


/* ---------- auto-edit: apply rules learned from earlier reels (learn/learn.py -> lessons.json) ---------- */
const STOP=new Set('the a an of to in on and for with is are was were it that this at by from as or be'.split(' '));
function keyWordIdx(g,a){const toks=(a.a+' '+(a.b||'')+' '+(a.items||'')).toLowerCase().replace(/[^a-z0-9+ ]/g,' ').split(/\s+/).filter(t=>t&&!STOP.has(t));
 const nums=toks.filter(t=>/\d/.test(t)),pri=[...nums,...toks];
 for(const t of pri){const i=g.w.findIndex(w=>w[0].toLowerCase().replace(/[^a-z0-9+]/g,'').startsWith(t.replace(/[^a-z0-9]/g,'')));if(i>=0)return i}
 return Math.floor(g.w.length/2)}
function autoEdit(){
 const v=V(),e=ED(),R=LESSONS.rules,[lo,hi]=R.graphic_len_s;let n=0;
 e.anims.forEach(a=>{const g=v.segs[a.s];if(!g||!a.on)return;
  const i=keyWordIdx(g,a),keyT=Math.max(0,g.w[i][1]-g.s),lead=Math.min(R.graphic_lead_in_s,keyT);
  a.o=+Math.max(0,keyT-lead).toFixed(2);
  const need=(g.e-g.s)-a.o+0.4;a.d=+Math.min(hi,Math.max(lo,ANIMS[a.t].full?Math.min(need,3.2):need)).toFixed(2);n++});
 pause();save(v,e);afterAnim();toast('Retimed '+n+' animations to the spoken words ('+R.graphic_lead_in_s+'s lead-in)');
}
