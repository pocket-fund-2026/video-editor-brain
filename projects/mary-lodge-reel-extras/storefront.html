<!doctype html>
<html><head><meta charset="utf-8"><title>Mary Lodge storefront (three.js)</title>
<style>html,body{margin:0;background:#0b1013;overflow:hidden}canvas{display:block}</style></head>
<body>
<script src="vendor/three.min.js"></script>
<script>
// Mary Lodge by Subko, Chapel Road, Bandra West. A designed 3D rendering of a 1925 Portuguese-style bungalow.
// Everything is a pure function of time: window.setT(t) poses the scene, window.ready flags first render.
const Wd = +(new URLSearchParams(location.search).get('w') || 1080), Ht = +(new URLSearchParams(location.search).get('h') || 1920);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(Wd, Ht); renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const SKY = new THREE.Color('#aecbdc');
scene.background = SKY; scene.fog = new THREE.Fog(SKY, 40, 110);
const cam = new THREE.PerspectiveCamera(40, Wd / Ht, 0.1, 200);

// ---------- materials (cool whitewash, deep green shutters, slate roof; no orange or cream) ----------
const M = (c, r = 0.9, m = 0) => new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: m });
const mWall = M('#e6e9e8', 0.95), mWallShade = M('#cfd5d5', 0.95), mPlinth = M('#5d6a6c', 1);
const mGreen = M('#2c5a48', 0.7), mGreenDark = M('#1e4033', 0.7), mWood = M('#4a3a30', 0.8), mGlass = M('#1b2a30', 0.15, 0.2);
const mRoof = M('#46545a', 0.85), mRoofCap = M('#35424a', 0.85), mBrass = M('#b8964a', 0.35, 0.8), mIron = M('#20272a', 0.6, 0.5);
const mRoad = M('#2e3437', 1), mPave = M('#8d9496', 1), mGrass = M('#4f7a4f', 1), mLeaf = M('#3f8a52', 0.9), mLeaf2 = M('#2f7345', 0.9);
const mTrunk = M('#5b4a3e', 1), mTable = M('#2a2f31', 0.6, 0.3), mSeat = M('#7a8f8a', 0.8);
const mLight = new THREE.MeshStandardMaterial({ color: '#ffe3a8', emissive: '#ffcf70', emissiveIntensity: 0, roughness: 0.4 });

function box(w, h, d, mat, x, y, z, parent) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true; (parent || scene).add(m); return m;
}
function cyl(rt, rb, h, mat, x, y, z, seg, parent) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg || 16), mat); m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true; (parent || scene).add(m); return m;
}
function rng(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }

// ---------- lights ----------
const hemi = new THREE.HemisphereLight('#cfe3f0', '#6e7b72', 0.75); scene.add(hemi);
const sun = new THREE.DirectionalLight('#fff3e0', 2.1);
sun.position.set(-14, 22, 20); sun.target.position.set(0, 3, 0); scene.add(sun, sun.target);
sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -22, right: 22, top: 18, bottom: -10, near: 1, far: 80 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;

// ---------- ground ----------
box(120, 0.2, 60, mRoad, 0, -0.1, 28);          // road
box(40, 0.3, 4.2, mPave, 0, -0.05, 9.2);        // pavement strip
box(40, 0.28, 6.4, mGrass, 0, -0.06, 4.6);      // compound lawn
box(40, 0.34, 0.5, mPlinth, 0, 0.02, 6.6);      // kerb edge of compound
// low compound wall with a gap for the gate
box(7.2, 0.9, 0.3, mWall, -8.4, 0.45, 6.5); box(7.2, 0.9, 0.3, mWall, 8.4, 0.45, 6.5);
box(0.5, 1.5, 0.5, mWall, -4.6, 0.75, 6.5); box(0.5, 1.5, 0.5, mWall, 4.6, 0.75, 6.5);
box(40, 0.02, 0.12, M('#d8d8d0'), 0, 0.03, 14);  // road dash line
{ const r = rng(3); for (let i = -9; i < 10; i++) box(1.6, 0.02, 0.12, M('#d8dcd8'), i * 2.4, 0.04, 17.5); }
// path to the door
box(2.4, 0.06, 6.2, mPave, 0, 0.0, 3.6);

// ---------- main bungalow ----------
const house = new THREE.Group(); scene.add(house);
const W = 14, D = 9, HG = 3.7, HU = 3.3;
box(W + 0.5, 0.7, D + 0.5, mPlinth, 0, 0.35, -D / 2 + 0.1, house);
box(W, HG + HU, D, mWall, 0, 0.7 + (HG + HU) / 2, -D / 2, house);
// string course between floors
box(W + 0.3, 0.22, D + 0.3, mWall, 0, 0.7 + HG, -D / 2, house);
box(W + 0.45, 0.1, D + 0.45, mWallShade, 0, 0.7 + HG - 0.16, -D / 2, house);
// corner quoins
for (const sx of [-1, 1]) box(0.5, HG + HU, 0.5, mWallShade, sx * (W / 2), 0.7 + (HG + HU) / 2, 0.1, house);

// veranda front: arcaded screen with five arches
const VZ = 2.3, ARCHES = 5, bayW = W / ARCHES;
function archScreen() {
  const sh = new THREE.Shape(); sh.moveTo(-W / 2, 0); sh.lineTo(W / 2, 0); sh.lineTo(W / 2, HG); sh.lineTo(-W / 2, HG); sh.lineTo(-W / 2, 0);
  for (let i = 0; i < ARCHES; i++) {
    const cx = -W / 2 + bayW * (i + 0.5), hw = bayW * 0.31, spring = HG * 0.55, top = HG * 0.88;
    const p = new THREE.Path(); p.moveTo(cx - hw, 0); p.lineTo(cx + hw, 0); p.lineTo(cx + hw, spring);
    p.absarc(cx, spring, hw, 0, Math.PI, false); p.lineTo(cx - hw, 0); sh.holes.push(p);
  }
  const g = new THREE.ExtrudeGeometry(sh, { depth: 0.42, bevelEnabled: false, curveSegments: 24 });
  const m = new THREE.Mesh(g, mWall); m.castShadow = true; m.receiveShadow = true; return m;
}
const arc = archScreen(); arc.position.set(0, 0.7, VZ - 0.2); house.add(arc);
box(W + 0.2, 0.28, 0.6, mWall, 0, 0.7 + HG + 0.14, VZ, house);                 // veranda cornice
box(W - 0.2, 0.12, VZ + 0.4, mWallShade, 0, 0.7 + HG - 0.02, VZ / 2 - 0.05, house); // veranda ceiling
box(W + 0.4, 0.14, VZ + 0.3, M('#9aa3a3', 1), 0, 0.77, VZ / 2 + 0.05, house);   // veranda floor (stone)
// veranda floor tiles pattern
{ for (let i = 0; i < 16; i++) for (let j = 0; j < 2; j++) box(0.86, 0.01, 0.86, (i + j) % 2 ? M('#7f8b8c', 1) : M('#a9b2b2', 1), -W / 2 + 0.5 + i * 0.88, 0.85, 0.5 + j * 0.9, house); }
// ground-floor details behind arches: central double door + two windows each side
function shutteredWindow(x, y, z, w, h, open, parent) {
  const g = new THREE.Group(); g.position.set(x, y, z); (parent || house).add(g);
  box(w + 0.3, h + 0.3, 0.12, mWallShade, 0, 0, 0, g);
  box(w, h, 0.14, mGlass, 0, 0, 0.02, g);
  box(0.06, h, 0.18, mGreenDark, 0, 0, 0.04, g); box(w, 0.06, 0.18, mGreenDark, 0, 0.1, 0.04, g);
  const sg = [];
  for (const s of [-1, 1]) {
    const pv = new THREE.Group(); pv.position.set(s * (w / 2 + 0.02), 0, 0.1); g.add(pv);
    const leaf = box(w / 2 - 0.02, h, 0.07, mGreen, -s * (w / 4 - 0.01), 0, 0, pv); leaf.userData.s = s;
    for (let k = 0; k < 7; k++) box(w / 2 - 0.16, 0.035, 0.08, mGreenDark, -s * (w / 4 - 0.01), -h / 2 + 0.18 + k * (h - 0.3) / 6, 0.03, pv);
    pv.userData = { s, open }; sg.push(pv);
  }
  g.userData.shutters = sg; return g;
}
const winsLower = [], winsUpper = [];
for (const x of [-5.4, -2.7, 2.7, 5.4]) winsLower.push(shutteredWindow(x, 0.7 + 1.9, 0.0, 1.1, 2.0, 1.4));
// door
const door = new THREE.Group(); door.position.set(0, 0.85, 0.02); house.add(door);
box(2.5, 3.1, 0.14, mWallShade, 0, 1.55, 0, door);
box(2.2, 2.9, 0.12, M('#0f1a1d', 0.2, 0.2), 0, 1.45, 0.03, door);
{ const dl = new THREE.Group(); dl.position.set(-1.05, 0, 0.08); door.add(dl); box(1.05, 2.8, 0.06, mGreen, 0.52, 1.4, 0, dl);
  for (let i = 0; i < 3; i++) for (let j = 0; j < 2; j++) box(0.4, 0.55, 0.02, mGlass, 0.3 + j * 0.45 - 0.05, 1.3 + i * 0.7, 0.04, dl);
  door.userData.L = dl;
  const dr = new THREE.Group(); dr.position.set(1.05, 0, 0.08); door.add(dr); box(1.05, 2.8, 0.06, mGreen, -0.52, 1.4, 0, dr);
  for (let i = 0; i < 3; i++) for (let j = 0; j < 2; j++) box(0.4, 0.55, 0.02, mGlass, -0.3 - j * 0.45 + 0.05, 1.3 + i * 0.7, 0.04, dr);
  door.userData.R = dr; }
// warm interior light behind the glass
const inner = new THREE.PointLight('#ffd9a0', 0, 9, 2); inner.position.set(0, 2.2, -2.0); house.add(inner);
box(2.2, 2.9, 0.02, mLight, 0, 2.3, -0.1, house);

// upper floor: balcony slab, balustrade, five shuttered windows
const UY = 0.7 + HG;
box(W + 0.6, 0.18, VZ + 0.5, mWall, 0, UY + 0.2, VZ / 2 + 0.2, house);
{ // balustrade: rail + turned spindles
  const bz = VZ + 0.4, by = UY + 0.3; box(W + 0.5, 0.1, 0.22, mWall, 0, by + 1.02, bz, house); box(W + 0.5, 0.1, 0.22, mWall, 0, by + 0.04, bz, house);
  for (let i = 0; i <= 38; i++) { const x = -W / 2 - 0.1 + i * (W + 0.2) / 38; const s = cyl(0.045, 0.06, 0.95, mWall, x, by + 0.55, bz, 10, house);
    cyl(0.07, 0.07, 0.07, mWall, x, by + 0.38, bz, 10, house); }
  for (const x of [-W / 2 - 0.1, W / 2 + 0.1, -2.4, 2.4]) box(0.22, 1.15, 0.22, mWall, x, by + 0.55, bz, house);
}
for (const x of [-5.4, -2.7, 0, 2.7, 5.4]) winsUpper.push(shutteredWindow(x, UY + 0.35 + 1.55, 0.02, 1.15, 2.2, 1.5));
// upper floor pilasters between windows
for (const x of [-4.05, -1.35, 1.35, 4.05]) box(0.28, HU - 0.2, 0.14, mWallShade, x, UY + 0.35 + HU / 2 - 0.1, 0.02, house);

// roof: hipped, slate, with a ridge cap
function hipRoof() {
  const w = W + 1.6, d = D + 1.6, h = 3.2, rz = 0.5, rx = w / 2 - d / 2 * 0.62, y0 = 0.7 + HG + HU + 0.1, z0 = -D / 2 + 0.1;
  const v = [[-w / 2, 0, d / 2], [w / 2, 0, d / 2], [w / 2, 0, -d / 2], [-w / 2, 0, -d / 2], [-rx, h, 0], [rx, h, 0]];
  const faces = [[0, 1, 5, 4], [1, 2, 5], [2, 3, 4, 5], [3, 0, 4]];
  const pos = [], uv = [];
  const tri = (a, b, c) => { [a, b, c].forEach((i) => pos.push(...v[i])); };
  tri(0, 1, 5); tri(0, 5, 4); tri(1, 2, 5); tri(2, 3, 4); tri(2, 4, 5); tri(3, 0, 4);
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  for (let i = 0; i < pos.length / 3; i++) uv.push(pos[i * 3] * 0.35, pos[i * 3 + 1] * 0.7 + pos[i * 3 + 2] * 0.35);
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); g.computeVertexNormals();
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 256; const c = cv.getContext('2d');
  c.fillStyle = '#4a585e'; c.fillRect(0, 0, 256, 256); const r = rng(11);
  for (let row = 0; row < 8; row++) for (let col = -1; col < 8; col++) { const x = col * 32 + (row % 2) * 16, y = row * 32; const t = 66 + Math.floor(r() * 30);
    c.fillStyle = 'rgb(' + (t - 8) + ',' + (t + 6) + ',' + (t + 12) + ')'; c.fillRect(x + 1.5, y + 1.5, 29, 29); c.fillStyle = 'rgba(0,0,0,0.28)'; c.fillRect(x, y + 28, 32, 4); }
  const tx = new THREE.CanvasTexture(cv); tx.wrapS = tx.wrapT = THREE.RepeatWrapping; tx.colorSpace = THREE.SRGBColorSpace; tx.anisotropy = 8;
  const mm = new THREE.MeshStandardMaterial({ map: tx, roughness: 0.85, side: THREE.DoubleSide });
  const mesh = new THREE.Mesh(g, mm); mesh.position.set(0, y0, z0); mesh.castShadow = true; mesh.receiveShadow = true; house.add(mesh);
  box(rx * 2, 0.2, 0.4, mRoofCap, 0, y0 + h + 0.05, z0, house);
  // eave fascia
  box(w, 0.18, 0.2, mRoofCap, 0, y0 + 0.02, z0 + d / 2, house);
  // veranda lean-to roof stripe over the upper balcony? kept open: balcony is an open terrace
  // chimney
  box(0.9, 2.4, 0.9, mWallShade, -4.6, y0 + 2.2, z0 - 0.5, house);
}
hipRoof();

// ---------- signage ----------
function signTexture() {
  const cv = document.createElement('canvas'); cv.width = 1024; cv.height = 320; const c = cv.getContext('2d');
  c.fillStyle = '#17352b'; c.fillRect(0, 0, 1024, 320);
  c.strokeStyle = '#d7e3dc'; c.lineWidth = 6; c.strokeRect(18, 18, 988, 284);
  c.fillStyle = '#eef3f0'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.font = '700 124px Georgia, "Times New Roman", serif'; c.fillText('MARY LODGE', 512, 140);
  c.font = '600 44px "Helvetica Neue", Arial, sans-serif'; c.fillStyle = '#b8d6c5'; c.fillText('B Y   S U B K O', 512, 250);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
const sign = new THREE.Group(); sign.position.set(0, 0.7 + HG - 0.42, VZ + 0.45); house.add(sign);
{ const board = new THREE.Mesh(new THREE.BoxGeometry(4.2, 1.3, 0.12), [mGreenDark, mGreenDark, mGreenDark, mGreenDark, new THREE.MeshStandardMaterial({ map: signTexture(), roughness: 0.6 }), mGreenDark]);
  board.castShadow = true; sign.add(board);
  for (const x of [-1.8, 1.8]) cyl(0.015, 0.015, 0.5, mIron, x, 0.9, -0.0, 8, sign); }
// hanging lanterns under the veranda
const lanterns = [];
for (const x of [-4.1, -1.4, 1.4, 4.1]) { const g = new THREE.Group(); g.position.set(x, 0.7 + HG - 0.18, 1.4); house.add(g);
  cyl(0.012, 0.012, 0.5, mIron, 0, -0.25, 0, 6, g); const l = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.1, 0.34, 10), mLight.clone()); l.position.y = -0.62; g.add(l);
  lanterns.push(l); }

// ---------- veranda furniture ----------
function chair(x, z, rot) { const g = new THREE.Group(); g.position.set(x, 0.85, z); g.rotation.y = rot; house.add(g);
  box(0.46, 0.05, 0.46, mSeat, 0, 0.45, 0, g); box(0.46, 0.5, 0.05, mSeat, 0, 0.72, -0.21, g);
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) cyl(0.02, 0.02, 0.45, mIron, sx * 0.2, 0.22, sz * 0.2, 6, g); }
function bistro(x, z) { const g = new THREE.Group(); g.position.set(x, 0.85, z); house.add(g);
  cyl(0.45, 0.45, 0.04, mTable, 0, 0.74, 0, 24, g); cyl(0.04, 0.04, 0.72, mIron, 0, 0.38, 0, 8, g); cyl(0.25, 0.25, 0.03, mIron, 0, 0.02, 0, 16, g);
  cyl(0.07, 0.06, 0.1, M('#f2f2ee', 0.3), 0.1, 0.81, 0.05, 14, g); // cup
  chair(x - 0.62, z, Math.PI / 2); chair(x + 0.62, z, -Math.PI / 2); }
bistro(-5.2, 1.5); bistro(5.2, 1.5); bistro(-2.7, 1.55);
// plants
function plant(x, z, s, parent) { const g = new THREE.Group(); g.position.set(x, 0, z); (parent || scene).add(g);
  cyl(0.28 * s, 0.22 * s, 0.5 * s, M('#6b7a7a', 0.9), 0, 0.25 * s, 0, 14, g);
  const r = rng(Math.floor(x * 31 + z * 17 + 5));
  for (let i = 0; i < 9; i++) { const l = new THREE.Mesh(new THREE.SphereGeometry(0.2 * s, 10, 8), i % 2 ? mLeaf : mLeaf2);
    l.position.set((r() - 0.5) * 0.5 * s, (0.6 + r() * 0.6) * s, (r() - 0.5) * 0.5 * s); l.scale.set(1, 1.5, 0.7); l.castShadow = true; g.add(l); } return g; }
for (const x of [-6.7, -1.35, 1.35, 6.7]) plant(x, 2.9, 1.5);

// ---------- street dressing: trees, lamp, parked scooter, A-frame board ----------
function tree(x, z, h, seed) { const g = new THREE.Group(); g.position.set(x, 0, z); scene.add(g);
  cyl(0.22, 0.34, h, mTrunk, 0, h / 2, 0, 10, g); const r = rng(seed);
  for (let i = 0; i < 26; i++) { const s = new THREE.Mesh(new THREE.SphereGeometry(0.9 + r() * 0.7, 12, 10), i % 3 ? mLeaf : mLeaf2);
    s.position.set((r() - 0.5) * 4, h + 0.4 + r() * 2.2, (r() - 0.5) * 3.2); s.castShadow = true; s.receiveShadow = true; g.add(s); }
  return g; }
const trees = [tree(-10.5, 5.2, 4.2, 5), tree(11, 5.4, 4.6, 9), tree(-16, 8.5, 5, 13)];
{ const g = new THREE.Group(); g.position.set(7.8, 0, 9); scene.add(g); cyl(0.07, 0.09, 4.2, mIron, 0, 2.1, 0, 10, g); box(0.9, 0.08, 0.14, mIron, 0.3, 4.2, 0, g); box(0.3, 0.14, 0.22, mLight.clone(), 0.65, 4.12, 0, g); }
function scooter(x, z, rot, col) { const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = rot; scene.add(g);
  const body = M(col, 0.5, 0.2); box(1.5, 0.28, 0.42, body, 0, 0.5, 0, g); box(0.5, 0.6, 0.42, body, 0.55, 0.85, 0, g); box(0.5, 0.1, 0.3, mIron, -0.2, 0.75, 0, g);
  for (const sx of [-0.55, 0.62]) { const w = cyl(0.22, 0.22, 0.14, mIron, sx, 0.22, 0, 20, g); w.rotation.x = Math.PI / 2; } box(0.08, 0.5, 0.5, mIron, 0.75, 1.0, 0, g); return g; }
scooter(-3.6, 10.2, 0.2, '#7aa5b5'); scooter(3.8, 10.4, -0.1, '#c9d4d6');

// ---------- time function ----------
const clamp = (x) => Math.max(0, Math.min(1, x)), seg = (t, a, b) => clamp((t - a) / (b - a));
const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2), eo = (x) => 1 - Math.pow(1 - x, 3);
const eob = (x, o = 1.5) => { const c3 = o + 1; return 1 + c3 * Math.pow(x - 1, 3) + o * Math.pow(x - 1, 2); };
const lerp = (a, b, t) => a + (b - a) * t;
const look = new THREE.Vector3();

window.setT = function (t, opts) {
  opts = opts || {};
  // camera: wide and high on the street, a slow glide down to a human-height push toward the arches
  const a = eio(seg(t, 0, 7.5));
  cam.position.set(lerp(-17, 0.6, a), lerp(10.5, 2.4, a), lerp(31, 17.5, a));
  look.set(lerp(-1, 0, a), lerp(5.2, 3.3, a), 0);
  cam.fov = lerp(40, 50, a); cam.updateProjectionMatrix();
  cam.position.x += Math.sin(t * 0.55) * 0.12; cam.position.y += Math.sin(t * 0.8 + 1) * 0.05;
  cam.lookAt(look);
  // shutters swing open one after another (physical reason: the cafe opens)
  const all = winsLower.concat(winsUpper);
  all.forEach((w, i) => w.userData.shutters.forEach((pv) => {
    const p = eob(seg(t, 1.2 + i * 0.22, 1.9 + i * 0.22), 1.3);
    pv.rotation.y = pv.userData.s * (-0.25 + p * 1.75) * -1 * -1;
  }));
  // double door opens inward
  const dp = eob(seg(t, 3.0, 4.0), 1.2);
  door.userData.L.rotation.y = -dp * 1.25; door.userData.R.rotation.y = dp * 1.25;
  // lanterns and interior glow come on
  const li = seg(t, 2.2, 3.4);
  lanterns.forEach((l, i) => { l.material.emissiveIntensity = 2.2 * clamp(li * 2 - i * 0.25); });
  inner.intensity = 14 * seg(t, 2.8, 4.2); mLight.emissiveIntensity = 0.9 * seg(t, 2.8, 4.2);
  // sign settles with a tiny sway
  sign.rotation.z = Math.sin(t * 1.3) * 0.006 * (1 - seg(t, 4, 7));
  // tree canopies breathe
  trees.forEach((tr, i) => tr.rotation.z = Math.sin(t * 0.9 + i) * 0.006);
  renderer.render(scene, cam); window.ready = true;
};
window.setT(0);
</script></body></html>
