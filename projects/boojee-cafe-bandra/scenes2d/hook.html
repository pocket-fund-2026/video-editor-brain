<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'BSS';src:url('../media/fonts/BigShouldersStencil.ttf');font-weight:100 900}
@font-face{font-family:'DMM';src:url('../media/fonts/DMMono-Medium.ttf');font-weight:500}
html,body{margin:0;background:#F2F3F0}#stage{width:1080px;height:1920px;position:relative;overflow:hidden}</style></head><body>
<div id="stage"></div>
<script src="common2d.js"></script><script src="hook.js"></script>
<script>
const stage = document.getElementById('stage');
window.pending = 0;
Promise.all([document.fonts.load("900 100px BSS"), document.fonts.load("500 40px DMM")]).then(() => document.fonts.ready).then(() => {
  window.setT = (t) => { window.SCENE.setT(t, stage); window.ready = true; }; window.setT(0);
});
</script></body></html>
