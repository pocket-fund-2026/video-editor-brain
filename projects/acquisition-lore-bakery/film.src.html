<!doctype html><html><head><meta charset="utf-8"><title>Acquisition Lore - bakery</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{--black:#0A0A0A;--white:#fff;--orange:#D3743E;--paper:#F3EEE6;--graphite:#1E1E1E;--smoke:#75747A;--ember:#A4501F}
html,body{margin:0;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--black);font-family:'Archivo',sans-serif;box-sizing:border-box}
#stage *{box-sizing:border-box}
.scene{position:absolute;inset:0;overflow:hidden}
.g-black{background:var(--black);color:var(--white)}.g-paper{background:var(--paper);color:var(--black)}
.abs{position:absolute}
.lab{position:absolute;left:96px;top:345px;font:700 28px 'JetBrains Mono',monospace;letter-spacing:.04em;text-transform:uppercase}
.g-black .lab{color:var(--orange)}.g-paper .lab{color:var(--ember)}
.h{position:absolute;left:96px;font-weight:900;letter-spacing:-.02em;line-height:1.03;white-space:nowrap}
.m{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.12em;margin-bottom:-.12em}
.w{display:inline-block;will-change:transform}
.acc{font-family:'Instrument Serif','Archivo',serif;font-style:italic;font-weight:400;font-size:1.08em;letter-spacing:0}
.g-black .acc{color:var(--orange)}.g-paper .acc{color:var(--ember)}
.mono{font-family:'JetBrains Mono',monospace}
.st{position:relative;display:inline-block}
.st i{position:absolute;left:-2%;top:54%;height:.075em;min-height:7px;width:0;background:var(--smoke)}
.cap{position:absolute;left:96px;top:1185px;max-width:820px;padding:16px 26px;background:rgba(10,10,10,.65);color:#fff;font:700 54px/1.12 'Archivo',sans-serif;border-radius:6px;opacity:0}
.cap b{color:var(--orange);font-weight:700}
.g-paper .cap{background:rgba(10,10,10,.86)}
.stamp{position:absolute;font:700 60px 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.02em;border:7px solid currentColor;padding:6px 20px;opacity:0;white-space:nowrap;border-radius:4px}
.slip{position:absolute;background:#fff;color:var(--black);box-shadow:0 12px 26px rgba(0,0,0,.30);filter:none}
.row{position:absolute;left:36px;right:36px;font:700 32px 'JetBrains Mono',monospace;display:flex;justify-content:space-between;align-items:baseline;opacity:0}
.row .n{font:900 44px 'Archivo',sans-serif}
.tape{position:absolute;width:150px;height:44px;background:rgba(117,116,122,.55);opacity:.9}
.host{position:absolute;transform-origin:50% 100%;will-change:transform}
svg.mk{position:absolute;overflow:visible;pointer-events:none}
#grain{position:absolute;inset:-40px;z-index:50;opacity:.9;pointer-events:none}
#bug{position:absolute;left:96px;top:260px;width:300px;z-index:40}
</style></head><body><div id="stage"></div>
<script>
const CUES=/*CUES*/null, ASSET=/*ASSETS*/null;
const stage=document.getElementById('stage');
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), ease=x=>1-Math.pow(1-clamp(x),3), E=CUES.ev;
const q=t=>Math.round(t*30)/30, q12=t=>Math.floor(t*12)/12;
const mk=(tag,cls,html,st)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(st)Object.assign(e.style,st);return e};
const UNITLESS={lineHeight:1,fontWeight:1,opacity:1,zIndex:1};const px=o=>{const s={};for(const k in o)s[k]=(typeof o[k]==='number'&&!UNITLESS[k])?o[k]+'px':o[k];return s};
function box(par,cls,st,html){const e=mk('div',cls,html,px(st||{}));if(st&&('top' in st||'left' in st)&&!st.position)e.style.position='absolute';par.appendChild(e);return e}
// reveal words one by one from a mask (brand headline motion). spec: [{t:'text',at:sec,cls:''}]
function headline(par,x,y,size,lines){const h=box(par,'h',{left:x,top:y,fontSize:size});const ws=[];
  lines.forEach((ln,li)=>{const row=mk('div',null,null,{whiteSpace:'nowrap'});ln.forEach(wd=>{const m=mk('span','m');const w=mk('span','w'+(wd.cls?' '+wd.cls:''),wd.t);if(wd.style)Object.assign(w.style,wd.style);m.appendChild(w);row.appendChild(m);row.appendChild(document.createTextNode(' '));ws.push({w,at:wd.at,el:wd.st});});h.appendChild(row)});
  return {h,ws}}
function upd_headline(H,t,d=.35){H.ws.forEach(o=>{const p=ease((t-o.at)/d);o.w.style.transform=`translateY(${(1-p)*115}%)`;})}
function pop(e,t,t0,o={}){const d=o.d||.3,p=ease((t-t0)/d),r=(o.rot||0),dy=o.dy==null?40:o.dy;e.style.opacity=t>=t0?Math.min(1,p*2):0;e.style.transform=`translate(${(o.dx||0)*(1-p)}px,${(1-p)*dy}px) rotate(${r+(1-p)*(o.wob||0)}deg) scale(${1+(1-p)*(o.sc||0)})`}
function stampAt(e,t,t0,rot){const p=clamp((t-t0)/.12);e.style.opacity=t>=t0?1:0;const sh=(t>=t0&&t<t0+.07)?((Math.round((t-t0)*30)%2)?5:-5):0;e.style.transform=`translateX(${sh}px) rotate(${rot}deg) scale(${1.3-0.3*ease(p)})`}
function strikeAt(el,t,t0,d=.25){el.style.width=(ease((t-t0)/d)*104)+'%'}
function countText(e,t,t0,t1,a,b,fmt){const p=ease((t-t0)/(t1-t0));const v=t<t0?a:Math.round(a+(b-a)*p);e.textContent=fmt(v)}
function svgMark(par,x,y,w,h,d,color,sw){const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('class','mk');Object.assign(s.style,px({left:x,top:y,width:w,height:h}));s.setAttribute('viewBox',`0 0 ${w} ${h}`);
  const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',d);p.setAttribute('fill','none');p.setAttribute('stroke',color||'#D3743E');p.setAttribute('stroke-width',sw||9);p.setAttribute('stroke-linecap','round');p.setAttribute('pathLength','1');p.style.strokeDasharray='1';p.style.strokeDashoffset='1';s.appendChild(p);par.appendChild(s);return p}
function drawMark(p,t,t0,d=.38){const k=q12(t);const v=clamp((k-t0)/d);p.style.strokeDashoffset=String(1-v);p.style.opacity=v>0?1:0}
const ul=(w)=>`M6 ${14} C ${w*.2} 4, ${w*.4} 22, ${w*.6} 10 S ${w*.9} 18, ${w-6} 8`;
const circ=(w,h)=>`M${w*.52} 6 C ${w*.15} 2, 4 ${h*.35}, 10 ${h*.7} C ${w*.2} ${h-4}, ${w*.8} ${h-2}, ${w-8} ${h*.55} C ${w-4} ${h*.2}, ${w*.55} 2, ${w*.3} 12`;
// Host
const POSEDIM={neutral:[560,700],point:[700,635],win:[700,635],chest:[700,635],present:[700,635]};
function makeHost(par,side,pose0,poses,nods,wid){const w=wid||(pose0==='neutral'?560:640);const hosts={};const el=mk('div','host');const img=mk('img');img.style.cssText='display:block;width:100%;height:auto';el.appendChild(img);
  par.appendChild(el);const o={el,img,poses:[[0,pose0]].concat(poses||[]),nods:nods||[],side,w};return o}
function updHost(o,t,base){let cur=o.poses[0];for(const p of o.poses)if(t>=p[0])cur=p;const pose=cur[1];if(o.img.dataset.p!==pose){o.img.src=ASSET['host_'+pose];o.img.dataset.p=pose}
  const dim=POSEDIM[pose],w=(pose==='neutral'?Math.min(o.w,560):o.w),h=w*dim[1]/dim[0];o.el.style.width=w+'px';o.el.style.height=h+'px';
  o.el.style.left=(o.side==='L'?-40:1080-w+40)+'px';o.el.style.top=(1345)+'px';
  const breath=1+0.015*(0.5-0.5*Math.cos(2*Math.PI*(t-base)/3));
  let pp=0;if(cur[0]>base+0.01&&t>=cur[0]&&t<cur[0]+.17){const x=(t-cur[0])/.17;pp=0.04*Math.sin(Math.PI*x)}
  let nod=0;for(const n of o.nods){if(t>=n&&t<n+.28)nod=2.4*Math.sin(Math.PI*(t-n)/.28)}
  o.el.style.transform=`scale(${breath+pp}) rotate(${nod*(o.side==='L'?1:-1)}deg)`}
// caption
function makeCap(par){return box(par,'cap')}
function updCap(cap,sid,t){const ph=CUES.phrases[sid];let k=-1;for(let i=0;i<ph.length;i++)if(t>=ph[i].s-0.03&&t<ph[i].hold)k=i;
  if(k<0){cap.style.opacity=0;cap.dataset.k='';return}
  if(cap.dataset.k!==String(k)){const p=ph[k];let h=p.text;if(p.key){const i=h.lastIndexOf(p.key);if(i>=0)h=h.slice(0,i)+'<b>'+p.key+'</b>'+h.slice(i+p.key.length)}cap.innerHTML=h;cap.dataset.k=String(k)}
  cap.style.opacity=clamp((t-(ph[k].s-0.03))/0.1)}
const SC=CUES.starts, SCENES=[];
function scene(id,ground){const root=box(stage,'scene g-'+ground);root.dataset.id=id;return root}
/*SCENES*/
// ---- top level
const bug=mk('img',null,null);bug.id='bug';bug.src=ASSET.logo_white;stage.appendChild(bug);
const grain=mk('div',null,null);grain.id='grain';grain.style.backgroundImage=`url(${ASSET.grain})`;grain.style.backgroundSize='256px 256px';stage.appendChild(grain);
const ids=Object.keys(SC);let zi=1;SCENES.forEach(s=>s.root.style.zIndex=zi++);
window.setT=function(t0){const t=q(t0);
  SCENES.forEach((s,i)=>{const st=SC[s.id],en=CUES.ends[s.id];const vis=(t>=st-0.24&&t<en+0.001)||(i===0&&t<en);s.root.style.display=vis?'block':'none';
    if(!vis)return;const p=i===0?1:ease((t-(st-0.24))/0.24);s.root.style.transform=`translateX(${(1-p)*1080}px)`;s.update(t,p)});
  // logo bug: reversed on paper, hidden on close card (full wordmark replaces it)
  let cur=SCENES.find(s=>t>=SC[s.id]-0.12&&t<CUES.ends[s.id])||SCENES[0];bug.src=(cur.ground==='black'||cur.ground==='split')?ASSET.logo_white:ASSET.logo_dark;
  bug.style.opacity=cur.id==='s11'?0:1;
  const f=Math.floor(t*30/2);grain.style.transform=`translate(${(f*37)%40}px,${(f*61)%40}px)`};
window.pending=0;
Promise.all([document.fonts.load('900 100px Archivo'),document.fonts.load('700 50px Archivo'),document.fonts.load('italic 100px "Instrument Serif"'),document.fonts.load('700 30px "JetBrains Mono"'),document.fonts.ready,
 ...Object.values(ASSET).filter(u=>u.startsWith('data:image')||u.endsWith('.png')).map(u=>new Promise(r=>{const i=new Image();i.onload=r;i.onerror=r;i.src=u}))]).then(()=>{window.setT(0);window.ready=true});
</script></body></html>
