// ---------- transitions: how scene i enters over scene i-1 ----------
const TT={1:'cut',2:'slide',3:'tear',4:'iris',5:'wipe',6:'drop',7:'cut'};
function mk(){const d=document.createElement('div');d.className='sc';return d}
function renderScene(i,t){const c=mk(); DRAW[SCENES[i].id](c,t); return c}
function renderAt(T){
  stage.innerHTML=''; T=clamp(T,0,TOTAL-0.001);
  let i=SCENES.findIndex(s=>T>=s.start&&T<s.start+s.dur); if(i<0) i=SCENES.length-1; const t=T-SCENES[i].start;
  const type=TT[i];
  if(i>0&&type&&type!=='cut'&&t<TR){
    const u=t/TR, A=renderScene(i-1,SCENES[i-1].dur-0.001), B=renderScene(i,t);
    stage.appendChild(A);
    if(type==='slide'){const x=lerp(1080,0,ease(u)); const sh=document.createElement('div'); sh.className='abs'; sh.style.cssText=`left:${x-22}px;top:0;width:1102px;height:1920px;background:#000`; stage.appendChild(sh); B.style.transform=`translateX(${x}px)`; B.style.borderLeft='4px solid #000'; stage.appendChild(B)}
    else if(type==='drop'){const y=lerp(-1920,0,ease(u)); const sh=document.createElement('div'); sh.className='abs'; sh.style.cssText=`left:0;top:${y-22}px;width:1080px;height:1942px;background:#000`; stage.appendChild(sh); B.style.transform=`translateY(${y}px)`; B.style.borderBottom='4px solid #000'; stage.appendChild(B)}
    else if(type==='tear'){const edge=lerp(1960,-80,ease(u)); const jag=[]; for(let k=0;k<=27;k++) jag.push([k*40,edge+((k*53)%37)-18+(k%2?12:-12)]);
      const clip='polygon('+jag.map(p=>p[0]+'px '+p[1]+'px').join(',')+',1080px 1960px,0px 1960px)', shade='polygon('+jag.map(p=>p[0]+'px '+(p[1]-14)+'px').join(',')+',1080px 1960px,0px 1960px)';
      const s=document.createElement('div'); s.className='abs'; s.style.cssText=`left:0;top:0;width:1080px;height:1920px;background:#000;clip-path:${shade}`; stage.appendChild(s); B.style.clipPath=clip; stage.appendChild(B)}
    else if(type==='wipe'){const x=lerp(-30,1110,ease(u)); B.style.clipPath=`inset(0 ${Math.max(0,1080-x)}px 0 0)`; stage.appendChild(B); const bar=document.createElement('div'); bar.className='abs'; bar.style.cssText=`left:${x-14}px;top:0;width:28px;height:1920px;background:#000`; stage.appendChild(bar)}
    else if(type==='iris'){const half=u<.5; const r=half?lerp(1100,0,ease(u*2)):lerp(0,1100,ease((u-.5)*2)); stage.innerHTML=''; stage.appendChild(half?A:B); const m=document.createElementNS('http://www.w3.org/2000/svg','svg'); m.setAttribute('class','abs'); m.setAttribute('width','1080'); m.setAttribute('height','1920'); m.style.cssText='left:0;top:0'; m.innerHTML=`<path fill-rule="evenodd" d="M0 0H1080V1920H0Z M540 960 m-${r} 0 a${r} ${r} 0 1 0 ${2*r} 0 a${r} ${r} 0 1 0 ${-2*r} 0Z" fill="#000"/>`; stage.appendChild(m)}
  } else stage.appendChild(renderScene(i,t));
}
